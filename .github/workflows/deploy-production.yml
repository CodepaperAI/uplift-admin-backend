name: Deploy production admin API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-admin-api
  cancel-in-progress: false

jobs:
  verify-build-deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "574521704327"
      ECR_REPOSITORY: uplift-production-admin-api
      INSTANCE_NAME: uplift-production-admin-api

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install and verify
        run: |
          bun install --frozen-lockfile
          DATABASE_URL=postgresql://prisma:prisma@localhost:5432/prisma bunx prisma generate
          bun run check
          bun run build

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::574521704327:role/uplift-production-admin-api-github-deploy
          aws-region: us-east-1

      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=true \
            --sbom=true \
            --tag "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG" \
            --push .

      - name: Reject critical ECR findings
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          index_manifest=$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --accepted-media-types application/vnd.oci.image.index.v1+json \
            --query 'images[0].imageManifest' --output text)
          scan_digest=$(jq -er \
            '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' \
            <<<"$index_manifest")
          # Basic scan-on-push needs longer than the old 30x5s window on an
          # image this size. When it overran, the loop fell through and the
          # findings call below crashed the AWS CLI with "'NoneType' object does
          # not support item assignment" — a closed gate, but an unreadable one,
          # and unrepeatable because the tag is immutable and already pushed.
          status=""
          for attempt in $(seq 1 60); do
            status=$(aws ecr describe-image-scan-findings \
              --repository-name "$ECR_REPOSITORY" \
              --image-id imageDigest="$scan_digest" \
              --query 'imageScanStatus.status' --output text 2>/dev/null || true)
            if [[ "$status" == "COMPLETE" || "$status" == "ACTIVE" ]]; then break; fi
            if [[ "$status" == "FAILED" ]]; then
              echo "::error::ECR image scan reported FAILED for $scan_digest"
              exit 1
            fi
            sleep 10
          done
          if [[ "$status" != "COMPLETE" && "$status" != "ACTIVE" ]]; then
            echo "::error::ECR image scan did not finish within 10 minutes (last status: ${status:-unknown}). Refusing to deploy an unscanned image."
            exit 1
          fi
          critical=$(aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageDigest="$scan_digest" \
            --query 'imageScanFindings.findingSeverityCounts.CRITICAL' --output text)
          [[ "$critical" == "None" || "$critical" == "0" ]]

      - name: Deploy through Systems Manager
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          instance_id=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$INSTANCE_NAME" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          [[ "$instance_id" =~ ^i-[a-f0-9]+$ ]]
          command_id=$(aws ssm send-command \
            --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript \
            --parameters "commands=sudo /opt/uplift-admin-api/deploy.sh $IMAGE_TAG" \
            --comment "Deploy admin API $IMAGE_TAG" \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$instance_id"
          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$instance_id" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

      - name: Verify local readiness through SSM
        run: |
          instance_id=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$INSTANCE_NAME" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          command_id=$(aws ssm send-command \
            --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=sudo docker exec runtime-admin-api-1 wget -q -O - http://127.0.0.1:3000/health/ready' \
            --comment "Verify admin API readiness" \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$instance_id"
