name: Deploy production admin API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-admin-api
  cancel-in-progress: false

jobs:
  verify-build-deploy:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "574521704327"
      ECR_REPOSITORY: uplift-production-admin-api
      INSTANCE_NAME: uplift-production-admin-api

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install and verify
        env:
          # `db.config` builds the Prisma client at import time, so any module
          # that reaches it — including ones a test imports only for a pure
          # helper — needs this set or it throws "DATABASE_URL is required".
          # Nothing here connects: `prisma generate` reads the schema, and the
          # tests in `check` exercise logic, not the database. The same dummy
          # value `prisma generate` has always been given, now also in scope for
          # the tests, because until this commit the gate ran 5 of them and
          # never noticed.
          DATABASE_URL: postgresql://prisma:prisma@localhost:5432/prisma
        run: |
          bun install --frozen-lockfile
          bunx prisma generate
          bun run check
          bun run build

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::574521704327:role/uplift-production-admin-api-github-deploy
          aws-region: us-east-1

      - name: Verify target capacity before build
        run: |
          instance_id=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$INSTANCE_NAME" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          [[ "$instance_id" =~ ^i-[a-f0-9]+$ ]]
          command_id=$(aws ssm send-command \
            --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=sudo /opt/uplift-admin-api/deploy.sh --preflight' \
            --comment "Preflight admin API deployment capacity" \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$instance_id"
          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$instance_id" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=true \
            --sbom=true \
            --tag "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG" \
            --push .

      - name: Reject critical ECR findings
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          index_manifest=$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --accepted-media-types application/vnd.oci.image.index.v1+json \
            --query 'images[0].imageManifest' --output text)
          scan_digest=$(jq -er \
            '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' \
            <<<"$index_manifest")
          # ECR/Inspector scanning needs longer than the old 30x5s window on an
          # image this size. When it overran, the loop fell through and the
          # findings call below crashed the AWS CLI with "'NoneType' object does
          # not support item assignment" — a closed gate, but an unreadable one,
          # and unrepeatable because the tag is immutable and already pushed.
          # The previous version sent stderr to /dev/null and forced a zero exit,
          # so a call that failed every single time was indistinguishable from a
          # scan that was merely slow: `status` stayed empty for all 60 attempts
          # and the gate reported "last status: unknown". A slow scan returns
          # IN_PROGRESS, so empty always meant the call itself was failing — and
          # the one thing needed to know why had just been discarded. Keep the
          # error instead, and print it when the loop gives up.
          # Keep the two streams apart. Merging them with 2>&1 to capture the
          # error meant anything the CLI wrote to stderr on a *successful* call
          # landed in the value too, so a finished scan arrived as
          # "ACTIVE\n<noise>" and never matched "ACTIVE" — the gate could not
          # pass even when the scan was complete. Trim the result as well: a
          # trailing newline alone was enough to break the comparison.
          status=""
          last_error=""
          scan_stderr="$(mktemp)"
          for attempt in $(seq 1 60); do
            if probe=$(aws ecr describe-image-scan-findings \
              --repository-name "$ECR_REPOSITORY" \
              --image-id imageDigest="$scan_digest" \
              --no-paginate \
              --query 'imageScanStatus.status' --output text 2>"$scan_stderr"); then
              # The CLI auto-paginates describe-image-scan-findings, and under
              # enhanced scanning there are several pages — it printed the
              # status once per page, so the value arrived as
              # "ACTIVE\nNone\nNone\nNone" and stripping whitespace glued it
              # into ACTIVENoneNoneNone. Take the first line only, and stop it
              # walking pages just to read one field.
              status="$(printf '%s\n' "$probe" | head -1 | tr -d '[:space:]')"
              last_error=""
            else
              status=""
              last_error="$(cat "$scan_stderr")"
            fi
            if [[ "$status" == "COMPLETE" || "$status" == "ACTIVE" ]]; then break; fi
            if [[ "$status" == "FAILED" ]]; then
              echo "::error::ECR image scan reported FAILED for $scan_digest"
              exit 1
            fi
            # A permission error will not resolve by waiting. Retrying it 60
            # times costs ten minutes to learn nothing, which is how the real
            # cause stayed hidden for two runs.
            case "$last_error" in
              *AccessDenied*|*not\ authorized*) break ;;
            esac
            sleep 10
          done
          if [[ "$status" != "COMPLETE" && "$status" != "ACTIVE" ]]; then
            # Say which of the two actually happened. After the fail-fast break
            # above, "did not finish within 10 minutes" would be a lie about a
            # run that gave up in seconds.
            case "$last_error" in
              *AccessDenied*|*not\ authorized*)
                echo "::error::ECR scan status could not be read at all — the call was denied, not slow. Refusing to deploy an unscanned image."
                ;;
              *)
                echo "::error::ECR image scan did not finish within 10 minutes (last status: ${status:-none returned}). Refusing to deploy an unscanned image."
                ;;
            esac
            if [[ -n "$last_error" ]]; then
              echo "::error::Last error from describe-image-scan-findings: $last_error"
              case "$last_error" in
                *ScanNotFound*)
                  echo "::error::No scan exists for this digest. Scan-on-push is most likely disabled on $ECR_REPOSITORY — check ECR > Repositories > $ECR_REPOSITORY > Edit > Scan on push. The gate is failing closed on purpose; do not bypass it."
                  ;;
                *inspector2*)
                  echo "::error::This repository is on Amazon Inspector (enhanced scanning), not basic scanning, so describe-image-scan-findings now reads through inspector2 — and the deploy role has no inspector2 permissions. Attach this to uplift-production-admin-api-github-deploy:"
                  echo '::error::{"Effect":"Allow","Action":["inspector2:ListAccountPermissions","inspector2:ListCoverage","inspector2:ListFindings","inspector2:BatchGetFindingDetails"],"Resource":"*"}'
                  echo "::error::Nothing here is slow or flaky — every probe was denied. Fix the policy; do not bypass the gate."
                  ;;
                *AccessDenied*|*not\ authorized*)
                  echo "::error::The deploy role cannot read scan findings. Grant ecr:DescribeImageScanFindings, and inspector2:ListCoverage if the repository uses enhanced scanning."
                  ;;
              esac
            fi
            echo "::error::Digest queried: $scan_digest"
            exit 1
          fi
          # Same pagination trap as the status probe, and the reason an
          # earlier run died with no message at all: under enhanced scanning the
          # CLI walks several pages and prints the count once per page, so
          # "None\nNone\nNone" never equalled "None" — and a bare [[ ]] as the
          # final command under `bash -e` exits 1 silently. Read the findings
          # themselves rather than a per-page count, so there is one number and
          # it is the one being acted on.
          aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageDigest="$scan_digest" \
            --no-paginate \
            --query 'imageScanFindings.enhancedFindings[?severity==`CRITICAL`].{cve:packageVulnerabilityDetails.vulnerabilityId,pkg:packageVulnerabilityDetails.vulnerablePackages[0].name,installed:packageVulnerabilityDetails.vulnerablePackages[0].version,fixed:packageVulnerabilityDetails.vulnerablePackages[0].fixedInVersion}' \
            --output json > /tmp/criticals.json
          jq -e 'type == "array"' /tmp/criticals.json > /dev/null

          # An accepted risk has an owner and an expiry date. See
          # .github/ecr-critical-allowlist.txt for why this exists at all.
          today=$(date -u +%F)

          # Kept as shell rather than one heroic jq expression: this is the last
          # thing standing between a bad image and production, and it has to be
          # readable by whoever is looking at a red pipeline.
          blocking=0
          accepted=0
          expired=0
          report=""
          while IFS=$'\t' read -r cve pkg installed fixed; do
            [[ -z "$cve" || "$cve" == "null" ]] && continue
            rule=$(awk -v want="$cve" '$1 == want { print $2; exit }' \
              .github/ecr-critical-allowlist.txt)
            if [[ -z "$rule" ]]; then
              blocking=$((blocking + 1))
              report+=$'\n'"| \`$cve\` | $pkg $installed | fixed: $fixed | **blocking** |"
            elif [[ "$rule" < "$today" ]]; then
              expired=$((expired + 1))
              blocking=$((blocking + 1))
              report+=$'\n'"| \`$cve\` | $pkg $installed | fixed: $fixed | **acceptance expired $rule** |"
            else
              accepted=$((accepted + 1))
              report+=$'\n'"| \`$cve\` | $pkg $installed | fixed: $fixed | accepted until $rule |"
            fi
          done < <(jq -r '.[] | [.cve, .pkg, .installed, .fixed] | @tsv' /tmp/criticals.json)

          total=$(jq 'length' /tmp/criticals.json)
          echo "Scan status: $status. Critical findings: $total (blocking: $blocking, accepted: $accepted, expired acceptances: $expired)"
          if [[ -n "$report" ]]; then
            {
              echo "### Critical ECR findings on \`$scan_digest\`"
              echo
              echo "| CVE | package | fix | disposition |"
              echo "| --- | --- | --- | --- |"
              printf '%s\n' "$report"
            } >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          fi
          if [[ "$blocking" != "0" ]]; then
            echo "::error::$blocking critical finding(s) on $scan_digest are not accepted in .github/ecr-critical-allowlist.txt. Refusing to deploy."
            column -t -s $'\t' < <(jq -r '.[] | [.cve, .pkg, .installed, "fixed: " + (.fixed // "NotAvailable")] | @tsv' /tmp/criticals.json)
            exit 1
          fi
          if [[ "$accepted" != "0" ]]; then
            echo "::warning::Deploying with $accepted accepted critical finding(s). See .github/ecr-critical-allowlist.txt."
          fi
          echo "No blocking critical findings. Proceeding."

      - name: Deploy through Systems Manager
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          instance_id=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$INSTANCE_NAME" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          [[ "$instance_id" =~ ^i-[a-f0-9]+$ ]]
          command_id=$(aws ssm send-command \
            --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript \
            --parameters "commands=sudo /opt/uplift-admin-api/deploy.sh $IMAGE_TAG" \
            --comment "Deploy admin API $IMAGE_TAG" \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$instance_id"
          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$instance_id" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

      - name: Verify local readiness through SSM
        run: |
          instance_id=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$INSTANCE_NAME" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          command_id=$(aws ssm send-command \
            --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=sudo docker exec runtime-admin-api-1 wget -q -O - http://127.0.0.1:3000/health/ready' \
            --comment "Verify admin API readiness" \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$instance_id"
